name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: go test ./...
      - run: go build ./cmd/run
      - run: sh -n install.sh
      - run: npm test
        working-directory: server
