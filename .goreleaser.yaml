version: 2

builds:
  - id: run
    main: ./cmd/run
    binary: run
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: run
    builds:
      - run
    name_template: "run_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
